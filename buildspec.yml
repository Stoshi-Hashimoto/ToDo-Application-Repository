version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "719674478633"
    AWS_DEFAULT_REGION: "ap-northeast-1"
    ECR_REPOSITORY_NAME: "todo-front"
    ECS_CLUSTER_NAME: "todo-cluster"
    ECS_SERVICE_NAME: "todo-front-task-service-01aeci1v"
    IMAGE_TAG: "latest"

  parameter-store:
    NEXT_PUBLIC_API_BASE: "/todo/prod/NEXT_PUBLIC_API_BASE"
    NEXT_PUBLIC_COGNITO_DOMAIN: "/todo/prod/NEXT_PUBLIC_COGNITO_DOMAIN"
    NEXT_PUBLIC_COGNITO_CLIENT_ID: "/todo/prod/NEXT_PUBLIC_COGNITO_CLIENT_ID"
    NEXT_PUBLIC_COGNITO_REDIRECT_URI: "/todo/prod/NEXT_PUBLIC_COGNITO_REDIRECT_URI"

phases:
  pre_build:
    commands:
      - echo "Login to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME

  build:
    commands:
      - echo "NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE"
      - echo "NEXT_PUBLIC_COGNITO_DOMAIN=$NEXT_PUBLIC_COGNITO_DOMAIN"
      - echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID"
      - echo "NEXT_PUBLIC_COGNITO_REDIRECT_URI=$NEXT_PUBLIC_COGNITO_REDIRECT_URI"
      - echo "Build Docker image..."
      - cd web
      - docker build --build-arg NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE --build-arg NEXT_PUBLIC_COGNITO_DOMAIN=$NEXT_PUBLIC_COGNITO_DOMAIN --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID --build-arg NEXT_PUBLIC_COGNITO_REDIRECT_URI=$NEXT_PUBLIC_COGNITO_REDIRECT_URI -t $ECR_REPOSITORY_NAME:$IMAGE_TAG .
      - docker tag $ECR_REPOSITORY_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Push Docker image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Deploy to ECS..."
      - aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ECS_SERVICE_NAME --force-new-deployment
      - echo "Deployment completed."
